version: '3.8'

services:
  app:
    build: .
    container_name: digibank-app
    ports:
      - "8080:8080"
    environment:
      # Profil Spring (vide pour H2, 'dev' ou 'qa' pour PostgreSQL)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # Database configuration (optionnel, utilisé si SPRING_PROFILES_ACTIVE=dev)
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:h2:mem:digibank}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-sa}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
      SERVER_PORT: 8080
    networks:
      - digibank-network
    # PostgreSQL optionnel - décommenter pour utiliser
    # depends_on:
    #   postgres:
    #     condition: service_healthy

  # PostgreSQL - Optionnel
  # Décommenter pour utiliser PostgreSQL (et définir SPRING_PROFILES_ACTIVE=dev dans .env)
  postgres:
    image: postgres:15-alpine
    container_name: digibank-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digibank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digibank123}
      POSTGRES_DB: ${POSTGRES_DB:-digibankdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - digibank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digibank}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Décommenter la ligne ci-dessous pour démarrer automatiquement
    # profiles: ["postgres"]

volumes:
  postgres_data:

networks:
  digibank-network:
    driver: bridge
