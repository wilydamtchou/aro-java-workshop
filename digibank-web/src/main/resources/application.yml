spring:
  application:
    name: digibank

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  datasource:
    url: jdbc:h2:mem:digibank
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/h2

  thymeleaf:
    cache: true

  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      operationsSorter: method
    api-docs:
      path: /v3/api-docs
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO

error:
  include-message: never
  include-binding-errors: never
  include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
