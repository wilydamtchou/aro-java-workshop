name: DigiBank Complete DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_PROJECT_NAME: ${{ secrets.SONAR_PROJECT_NAME }}
  SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
  SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
  SPRING_PROFILES_ACTIVE: qa

jobs:

  ###############################################################
  # PARTIE 1 — BUILD + TESTS + COVERAGE
  ###############################################################

  build:
    name: Build DigiBank
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
      - name: Build project
        run: |
          mvn \
            -B \
            clean \
            package \
            -DskipTests
      - name: Upload compiled application
        uses: actions/upload-artifact@v4
        with:
          name: digibank-build
          path: digibank-web/target/digibank-web-*.jar

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Execute JUnit Tests
        run: |
          mvn \
            -B \
            test \
            -Dtest='!RunCucumberTest' \
            -DfailIfNoTests=false \
            -Dsurefire.failIfNoSpecifiedTests=false
      - name: Upload Unit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/target/surefire-reports/**'

  cucumber-tests:
    name: Cucumber Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Execute Cucumber Tests
        run: |
          mvn \
            -B \
            test \
            -Dtest='RunCucumberTest' \
            -DfailIfNoTests=false \
            -Dsurefire.failIfNoSpecifiedTests=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-reports
          path: '**/target/surefire-reports/**'

  jacoco:
    name: JaCoCo Coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Generate Coverage
        run: |
          mvn \
            -B \
            jacoco:prepare-agent \
            test \
            jacoco:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: |
            **/target/site/jacoco/**

  ###############################################################
  # PARTIE 2 — TOUS LES OUTILS SAST
  ###############################################################

  gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - cucumber-tests
      - jacoco
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - cucumber-tests
      - jacoco
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Get current week for cache key
        id: date
        run: echo "date=$(date +'%Y-W%U')" >> "$GITHUB_OUTPUT"
      - name: Cache Dependency-Check Database
        uses: actions/cache@v4
        with:
          path: odc-data
          key: dependency-check-db-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            dependency-check-db-${{ runner.os }}-
      - name: Run Dependency Check
        run: |
          mvn \
            -B \
            install \
            -DskipTests \
            -Dgpg.skip=true \
            org.owasp:dependency-check-maven:aggregate \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }}
      - name: Upload Dependency Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            **/target/dependency-check-report.*

  spotbugs:
    name: SpotBugs
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - cucumber-tests
      - jacoco
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run SpotBugs
        run: |
          mvn \
            -B \
            verify \
            spotbugs:spotbugs
      - name: Upload SpotBugs Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: |
            **/target/spotbugsXml.xml
            **/target/site/spotbugs.*

  pmd:
    name: PMD Analysis
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - cucumber-tests
      - jacoco
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run PMD
        run: |
          mvn \
            -B \
            compile \
            pmd:pmd
      - name: Upload PMD Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: |
            **/target/site/pmd.*

  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - cucumber-tests
      - jacoco
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run Checkstyle
        run: |
          mvn \
            -B \
            compile \
            checkstyle:checkstyle

      - name: Upload Checkstyle Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: |
            **/target/checkstyle-result.xml
            **/target/site/checkstyle.*

  pitest:
    name: PIT Mutation Testing
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - cucumber-tests
      - jacoco
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Execute PIT Mutation Testing
        run: |
          mvn \
            -B \
            clean \
            test-compile \
            org.pitest:pitest-maven:mutationCoverage
      - name: Upload PIT Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: |
            **/target/pit-reports/**

  ###############################################################
  # PARTIE 3 — SONAR + DOCKER + DEPLOIEMENT + NEWMAN
  ###############################################################

  sonar:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs:
      - gitleaks
      - dependency-check
      - spotbugs
      - pmd
      - checkstyle
      - pitest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
      - name: Rebuild avec couverture
        run: |
          mvn \
            -B \
            clean \
            package \
            jacoco:report \
            -DskipTests=false
      - name: Récupérer le rapport Dependency-Check
        uses: actions/download-artifact@v4
        with:
          name: dependency-check-report
          path: target
      - name: Récupérer le rapport PIT
        uses: actions/download-artifact@v4
        with:
          name: pit-report
          path: .
      - name: Analyse SonarQube
        run: |
          mvn \
            -B \
            sonar:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.projectName="${{ secrets.SONAR_PROJECT_NAME }}" \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: sonar
    if: needs.sonar.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer le jar compilé (Partie 1)
        uses: actions/download-artifact@v4
        with:
          name: digibank-build
          path: digibank-web/target
      - name: Construire l'image Docker
        run: |
          docker build -t digibank-app:ci .
      - name: Sauvegarder l'image en tar
        run: |
          docker save digibank-app:ci -o digibank-image.tar
      - name: Upload de l'image Docker
        uses: actions/upload-artifact@v4
        with:
          name: digibank-docker-image
          path: digibank-image.tar

  trivy:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer l'image Docker
        uses: actions/download-artifact@v4
        with:
          name: digibank-docker-image
      - name: Charger l'image Docker
        run: docker load -i digibank-image.tar
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'digibank-app:ci'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
      - name: Upload Trivy SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif
      - name: Upload to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  deploy-app:
    name: Deploy DigiBank (Runtime)
    runs-on: ubuntu-latest
    needs:
      - docker
      - trivy
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: digibank
          POSTGRES_USER: digibank
          POSTGRES_PASSWORD: digibank
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer l'image Docker
        uses: actions/download-artifact@v4
        with:
          name: digibank-docker-image
      - name: Charger l'image Docker
        run: |
          docker load -i digibank-image.tar
      - name: Démarrer le conteneur DigiBank
        run: |
          docker run -d \
            --name digibank-app \
            --network host \
            -e SPRING_PROFILES_ACTIVE=qa \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/digibank \
            -e SPRING_DATASOURCE_USERNAME=digibank \
            -e SPRING_DATASOURCE_PASSWORD=digibank \
            digibank-app:ci
      - name: Attendre /actuator/health
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/actuator/health; then
              echo "Application prête"
              exit 0
            fi
            echo "En attente du démarrage..."
            sleep 5
          done
          echo "L'application n'a pas démarré à temps"
          docker logs digibank-app
          exit 1

  newman:
    name: API Tests (Newman)
    runs-on: ubuntu-latest
    needs: deploy-app
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: digibank
          POSTGRES_USER: digibank
          POSTGRES_PASSWORD: digibank
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer l'image Docker
        uses: actions/download-artifact@v4
        with:
          name: digibank-docker-image
      - name: Charger l'image Docker
        run: docker load -i digibank-image.tar
      - name: Démarrer le conteneur DigiBank
        run: |
          docker run -d \
            --name digibank-app \
            --network host \
            -e SPRING_PROFILES_ACTIVE=qa \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/digibank \
            -e SPRING_DATASOURCE_USERNAME=digibank \
            -e SPRING_DATASOURCE_PASSWORD=digibank \
            digibank-app:ci
      - name: Attendre /actuator/health
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Installer Newman
        run: |
          npm install -g newman newman-reporter-htmlextra
      - name: Exécuter la collection Newman
        run: |
          newman run dast/postman/DigiBank-DAST-Collection.postman_collection.json \
            --environment dast/postman/DigiBank-Local.postman_environment.json \
            --reporters cli,htmlextra,json \
            --reporter-htmlextra-export newman-report.html \
            --reporter-json-export newman-report.json
      - name: Upload des rapports Newman
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: |
            newman-report.html
            newman-report.json
      - name: Arrêter le conteneur
        if: always()
        run: docker stop digibank-app || true

  ###############################################################
  # PARTIE 4 — OWASP ZAP + REPORTING + ARTIFACTS
  ###############################################################

  owasp-zap:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: newman
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: digibank
          POSTGRES_USER: digibank
          POSTGRES_PASSWORD: digibank
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer l'image Docker
        uses: actions/download-artifact@v4
        with:
          name: digibank-docker-image
      - name: Charger l'image Docker
        run: docker load -i digibank-image.tar
      - name: Démarrer le conteneur DigiBank
        run: |
          docker run -d \
            --name digibank-app \
            --network host \
            -e SPRING_PROFILES_ACTIVE=qa \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/digibank \
            -e SPRING_DATASOURCE_USERNAME=digibank \
            -e SPRING_DATASOURCE_PASSWORD=digibank \
            digibank-app:ci
      - name: Attendre /actuator/health
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: ZAP Baseline Scan (Passive)
        id: zap_baseline
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: 'http://localhost:8080'
          cmd_options: '-a'
          allow_issue_writing: false
      - name: ZAP Full Scan (Active + API + OWASP Top 10)
        id: zap_full
        uses: zaproxy/action-full-scan@v0.10.0
        continue-on-error: true
        with:
          target: 'http://localhost:8080'
          cmd_options: '-a -j -T 10'
          allow_issue_writing: false
      - name: Upload des rapports ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-reports
          path: |
            report_html.html
            report_json.json
            report_xml.xml
            report_sarif.json
      - name: Arrêter le conteneur
        if: always()
        run: docker stop digibank-app || true

  publish-dast-reports:
    name: Publish Reports & Build Status
    runs-on: ubuntu-latest
    needs:
      - sonar
      - dependency-check
      - newman
      - owasp-zap
    if: always()
    steps:
      - name: Télécharger tous les artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports
      - name: Lister les rapports collectés
        run: |
          echo "Rapports collectés :"
          find all-reports -type f
      - name: Upload du bundle consolidé
        uses: actions/upload-artifact@v4
        with:
          name: digibank-full-security-report
          path: all-reports
      - name: Statut final du build
        run: |
          if [ "${{ needs.sonar.result }}" == "success" ] && \
             [ "${{ needs.newman.result }}" == "success" ] && \
             [ "${{ needs.owasp-zap.result }}" == "success" ]; then
            echo "BUILD STATUS: SUCCESS"
          else
            echo "BUILD STATUS: FAILURE"
            exit 1
          fi